name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # required for npm trusted publishing over OIDC
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn

      # trusted publishing needs npm 11.5.1 or newer, and the runner ships 10
      - name: Update npm
        run: npm install --global npm@^11

      - run: yarn install --frozen-lockfile
        env:
          # setup-node writes an .npmrc referencing this variable, and yarn 1
          # aborts on an undefined one rather than substituting empty
          NODE_AUTH_TOKEN: ''

      - name: Refuse to publish a mismatched version
        run: |
          tag='${{ github.event.release.tag_name }}'
          version=$(node -p "require('./package.json').version")
          if [ "${tag#v}" != "$version" ]; then
            echo "Release tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

      - name: Publish to npm
        run: >-
          npm publish --provenance --access public
          ${{ github.event.release.prerelease && '--tag next' || '' }}
